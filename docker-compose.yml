services:
  # --- Backend (Symfony API + assets legacy Twig) ---
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
      # vendor/ et var/ sur des volumes nommés : sur Windows, les lire depuis le
      # bind mount direct est ~200x plus lent (stat/lecture de milliers de
      # petits fichiers via le pont gRPC-FUSE) et ralentit chaque requête de
      # plusieurs secondes à dizaines de secondes.
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    depends_on:
      - database
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://postgres:postgres@database:5432/univetmg_db?serverVersion=16&charset=utf8"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: univetmg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Vite dev server pour les assets legacy (pages Twig non encore migrées)
  legacy-assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  # --- Frontend (application React, découplée du backend) ---
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: "http://localhost:8080/api"
    depends_on:
      - nginx

volumes:
  db_data:
  backend_vendor:
  backend_var:
