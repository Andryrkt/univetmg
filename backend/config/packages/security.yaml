security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: api_login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        # Symfony ne sert plus que l'API (JWT, ci-dessus) et quelques assets
        # statiques/pages d'erreur ; ce firewall n'authentifie plus personne
        # par session, il existe juste pour couvrir le reste des requêtes
        # (ex: /build/* du serveur de dev Vite pour les assets legacy).
        main:
            pattern: ^/
            security: false

    access_control:
      - { path: ^/api/login, roles: PUBLIC_ACCESS }
      - { path: ^/api/register, roles: PUBLIC_ACCESS }
      - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
      - { path: ^/api/me, roles: ROLE_USER }
      - { path: ^/api, roles: ROLE_ADMIN }
